<svg width="520" height="140" viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .dark-blue { fill: #123E66; }
      .light-blue { fill: #37AEE2; }
      .line { stroke: #123E66; stroke-width: 6; stroke-linecap: round; }
      .node-stroke { stroke: #123E66; stroke-width: 5; fill: white; }
      .text-crest {
        font-family: "Arial Black", sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 82px;
        fill: #123E66;
        letter-spacing: -4px;
      }
      .text-erp {
        font-family: "Arial", sans-serif;
        font-weight: bold;
        font-style: italic;
        font-size: 48px;
        fill: #37AEE2;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- Molecule Icon -->
  <g transform="translate(15,90)">
    <line x1="20" y1="0" x2="60" y2="-30" class="line" />
    <line x1="60" y1="-30" x2="105" y2="10" class="line" />
    <line x1="105" y1="10" x2="140" y2="-60" class="line" />

    <circle cx="20" cy="0" r="14" class="node-stroke" />
    <circle cx="60" cy="-30" r="16" class="dark-blue" />
    <circle cx="105" cy="10" r="18" class="light-blue" />
    <circle cx="140" cy="-60" r="18" class="light-blue" />
  </g>

  <!-- Text -->
  <text x="190" y="105" class="text-crest">CREST</text>
  <text x="415" y="105" class="text-erp">ERP</text>
</svg>
